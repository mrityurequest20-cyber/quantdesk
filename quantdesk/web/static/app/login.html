<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantDesk · sign in</title>
<style>
:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.4 system-ui,-apple-system,sans-serif;
background:Canvas;color:CanvasText}form{width:min(360px,90vw);display:grid;gap:12px}h1{font-size:20px;margin:0}
p{margin:0;opacity:.75;font-size:14px}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #8886}
button{background:#2a78d6;color:#fff;border-color:#2a78d6}
</style></head>
<body><form onsubmit="location.href='/?token='+encodeURIComponent(document.getElementById('t').value);return false">
<h1>QuantDesk</h1><p>Enter the access token printed by <code>quantdesk serve</code>.</p>
<input id="t" type="password" autocomplete="current-password" placeholder="token" required autofocus>
<button type="submit">Open desk</button></form></body></html>
